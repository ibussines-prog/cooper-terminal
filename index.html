<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMBER_CRT_TERMINAL_V3.2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-off: #0a0700;
      --bg-on: #1a1200;
      --amber-dim: #a35700;
      --amber-mid: #ff8c00;
      --amber-hi: #ffaa00;
      --bg: var(--bg-on);
      --fg: var(--amber-mid);
      --hi: var(--amber-hi);
      --glow: 0 0 4px rgba(255, 140, 0, 0.7), 0 0 2px rgba(255, 140, 0, 0.4);
    }

    /* --- EFECTOS CRT --- */
    body {
      background-color: var(--bg-off);
      color: var(--fg);
      font-family: 'VT323', monospace;
      font-size: 18px;
      margin: 0; 
      padding: 10px; 
      min-height: 100vh;
      text-shadow: var(--glow);
      animation: flicker 0.15s infinite;
      box-sizing: border-box;
    }
    
    @keyframes flicker {
      0% { opacity: 0.98; }
      50% { opacity: 1; }
      100% { opacity: 0.99; }
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: 
        repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
      z-index: 999;
      pointer-events: none;
    }

    /* --- LAYOUT --- */
    .screen-frame {
      border: 2px double var(--fg);
      background: var(--bg);
      display: flex; 
      flex-direction: column;
      padding: 5px; 
      max-width: 1200px; 
      margin: 0 auto;
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.1) inset;
      min-height: 95vh;
    }

    .dos-header {
      background: var(--fg);
      color: var(--bg);
      padding: 5px; 
      font-weight: bold; 
      text-align: center;
      margin-bottom: 10px; 
      text-transform: uppercase; 
      font-size: 14px;
      text-shadow: none; 
    }

    /* --- CONTROLS --- */
    .cmd-line {
      display: flex; 
      flex-wrap: wrap;
      gap: 10px; 
      align-items: center;
      padding: 5px; 
      margin-bottom: 10px;
    }
    
    .prompt { color: var(--fg); white-space: nowrap; }
    
    input {
      background: var(--bg); 
      border: none;
      border-bottom: 2px solid var(--fg); 
      color: var(--hi);
      font-family: 'VT323', monospace; 
      font-size: 18px;
      flex-grow: 1;
      min-width: 120px;
      outline: none; 
      text-transform: uppercase;
    }

    button {
      background: var(--bg); color: var(--fg); border: none;
      font-family: 'VT323', monospace; font-size: 18px;
      cursor: pointer; padding: 5px;
    }
    button::before { content: "[ "; }
    button::after { content: " ]"; }
    
    #sysStatus { margin-left: auto; font-size: 14px; }

    /* --- VIEWPORT --- */
    .viewport {
      flex-grow: 1;
      border: 1px solid var(--amber-dim);
      background: var(--bg);
      overflow-x: auto; /* Permite scroll horizontal en tablas anchas */
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      min-width: 600px; /* Asegura que la tabla no se colapse en móvil */
    }

    th {
      text-align: right; 
      color: var(--hi);
      padding: 8px 5px;
      border-bottom: 2px dashed var(--fg);
    }
    th:first-child { text-align: left; }

    td { padding: 4px 5px; text-align: right; }
    td:first-child { text-align: left; color: var(--hi); }

    .row-month td {
      text-align: center; 
      padding: 15px 0 5px 0;
      letter-spacing: 2px;
      border-bottom: 1px dashed var(--amber-dim);
    }

    .row-avg td {
      border-top: 2px double var(--fg); 
      border-bottom: 2px double var(--fg);
      color: var(--hi); 
      background: rgba(255, 140, 0, 0.1);
    }

    .stat-max { color: var(--hi); text-decoration: underline; }
    .stat-dd { color: var(--hi); font-weight: bold; } 
    .blink { animation: blinker 1s step-end infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
    .boot-msg { padding: 2px 10px; color: var(--amber-dim); font-size: 16px; }

    /* MEDIA QUERIES */
    @media (max-width: 600px) {
      body { padding: 5px; font-size: 16px; }
      .cmd-line { flex-direction: column; align-items: flex-start; }
      #sysStatus { margin-left: 0; width: 100%; text-align: right; }
      input { width: 100%; }
    }
  </style>
</head>
<body>

<div class="screen-frame">
  <div class="dos-header">
    SYSTEM TERMINAL // COOPER FLAGG METRICS
  </div>

  <div class="cmd-line">
    <div>
        <span class="prompt">SYS:\></span>
        <button id="btnRun">EXEC FLAGG.BIN</button>
    </div>
    <div style="display:flex; flex-grow:1; width: 100%; align-items: center;">
        <span class="prompt">FILTER:</span>
        <input type="text" id="inpCmd" placeholder="*.*" autocomplete="off">
    </div>
    <span id="sysStatus">[STANDBY]</span>
  </div>

  <div class="viewport" id="consoleOutput">
    <div style="padding: 15px;">
      <div>WORKSTATION OS V3.2</div>
      <div>(C) COPYRIGHT SYSTEM CORP 1985</div>
      <br>
      <div>MEMORY CHECK... OK</div>
      <div>MOUNTING DATA VOLUME... OK</div>
      <br>
      <div>SYS:\> AWAITING INPUT<span class="blink">_</span></div>
    </div>
  </div>
</div>

<script>
(function() {
  const URL_TARGET = "https://www.espn.com/nba/player/gamelog/_/id/5041939/cooper-flagg";
  const PROXY = "https://corsproxy.io/?"; 
  
  const COLS = [
    { id: 'DATE', type: 'date' },
    { id: 'OPP',  type: 'str' },
    { id: 'RES',  type: 'str' },
    { id: 'MIN',  type: 'num' },
    { id: 'PTS',  type: 'num', max: true },
    { id: 'REB',  type: 'num', max: true },
    { id: 'AST',  type: 'num', max: true },
    { id: 'STL',  type: 'num', max: true },
    { id: 'BLK',  type: 'num', max: true },
    { id: 'GmSc', type: 'num', max: true }
  ];

  let MEMORY = [];
  let SORT = { key: 'DATE', desc: true };

  const ui = {
    btn: document.getElementById('btnRun'),
    inp: document.getElementById('inpCmd'),
    view: document.getElementById('consoleOutput'),
    stat: document.getElementById('sysStatus')
  };

  const clean = (v) => parseFloat(String(v).replace(/[^0-9.-]/g, '')) || 0;
  
  function getDosDate(m, d) {
    const y = m >= 8 ? 2025 : 2026;
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function parseStream(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const rows = Array.from(doc.querySelectorAll("tr"));
    const buffer = [];
    const checksum = new Set();

    rows.forEach(tr => {
      const td = tr.querySelectorAll("td");
      if (td.length < 16) return;
      const dTxt = td[0].textContent;
      if (!dTxt.includes("/")) return;

      const parts = dTxt.split(" ")[1].split("/");
      const mm = parseInt(parts[0]);
      const dd = parseInt(parts[1]);
      const iso = getDosDate(mm, dd);
      const opp = td[1].textContent.replace(/(@|vs)/g, '').trim();
      const hash = iso + opp;

      if(checksum.has(hash)) return;
      checksum.add(hash);

      const split = (i) => {
        const p = td[i].textContent.split("-");
        return { m: clean(p[0]), a: clean(p[1]) };
      };
      
      const val = (i) => clean(td[i].textContent);

      const byte = {
        DATE: iso, OPP: opp, RES: td[2].textContent,
        MIN: clean(td[3].textContent),
        PTS: val(16), REB: val(10), AST: val(11),
        BLK: val(12), STL: val(13), TO: val(15), PF: val(14),
        P3M: split(6).m, FGM: split(4).m, FGA: split(4).a, FTM: split(8).m, FTA: split(8).a
      };

      byte.GmSc = byte.PTS + (0.4 * byte.FGM) - (0.7 * byte.FGA) - (0.4 * (byte.FTA - byte.FTM)) 
                + (0.7 * byte.REB) + byte.STL + (0.7 * byte.AST) + (0.7 * byte.BLK) 
                - (0.4 * byte.PF) - byte.TO;

      buffer.push(byte);
    });
    return buffer;
  }

  function render() {
    const q = ui.inp.value.toUpperCase();
    const sub = MEMORY.filter(d => 
      d.DATE.includes(q) || d.OPP.toUpperCase().includes(q) || d.RES.toUpperCase().includes(q)
    );

    sub.sort((a,b) => {
      const va = a[SORT.key], vb = b[SORT.key];
      if(typeof va === 'string') return SORT.desc ? vb.localeCompare(va) : va.localeCompare(vb);
      return SORT.desc ? vb - va : va - vb;
    });

    let html = `<table><thead><tr>`;
    COLS.forEach(c => {
      const arrow = SORT.key === c.id ? (SORT.desc ? " v" : " ^") : "";
      html += `<th onclick="window.cmdSort('${c.id}')">${c.id}${arrow}</th>`;
    });
    html += `</tr></thead><tbody>`;

    const highs = {};
    COLS.forEach(c => { if(c.max) highs[c.id] = Math.max(...MEMORY.map(x=>x[c.id])); });
    
    let lastMonth = "";
    sub.forEach(r => {
      if(SORT.key === 'DATE') {
        const mk = r.DATE.substring(0,7);
        if(mk !== lastMonth) {
          html += `<tr class="row-month"><td colspan="${COLS.length}">-- ${mk} --</td></tr>`;
          lastMonth = mk;
        }
      }

      const isDD = (r.PTS>=10 && (r.REB>=10 || r.AST>=10));
      html += `<tr>`;
      COLS.forEach(c => {
        let v = r[c.id];
        let d = (c.id === 'GmSc') ? v.toFixed(1) : v;
        let cls = "";
        if(c.max && v === highs[c.id] && v>0) { d = `*${d}`; cls = "stat-max"; }
        else if (isDD && ['PTS','REB','AST'].includes(c.id) && v>=10) { cls = "stat-dd"; }
        html += `<td class="${cls}">${d}</td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table><div class="boot-msg">EOF: ${sub.length} RECORDS.</div>`;
    ui.view.innerHTML = html;
  }

  window.cmdSort = (k) => {
    if(SORT.key === k) SORT.desc = !SORT.desc;
    else { SORT.key = k; SORT.desc = true; }
    render();
  };

  async function exe() {
    ui.btn.disabled = true;
    ui.stat.innerText = "[BUSY]";
    ui.view.innerHTML = `<div class="boot-msg">CONNECTING...</div>`;
    
    try {
      const res = await fetch(PROXY + encodeURIComponent(URL_TARGET));
      const txt = await res.text();
      MEMORY = parseStream(txt);
      render();
      ui.stat.innerText = "[READY]";
    } catch(e) {
      ui.view.innerHTML = `<div class="boot-msg">ERROR: LINK_FAILED</div>`;
      ui.stat.innerText = "[HALT]";
    } finally {
      ui.btn.disabled = false;
    }
  }

  ui.btn.addEventListener('click', exe);
  ui.inp.addEventListener('input', render);
})();
</script>
</body>
</html>
