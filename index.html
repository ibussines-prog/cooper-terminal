<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AMBER_CRT_TERMINAL_V3.2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-off: #0a0700; --bg-on: #1a1200;
      --amber-dim: #a35700; --amber-mid: #ff8c00; --amber-hi: #ffaa00;
      --bg: var(--bg-on); --fg: var(--amber-mid); --hi: var(--amber-hi);
      --glow: 0 0 4px rgba(255, 140, 0, 0.7);
    }
    body {
      background-color: var(--bg-off); color: var(--fg);
      font-family: 'VT323', monospace; font-size: 18px;
      margin: 0; padding: 10px; min-height: 100vh;
      text-shadow: var(--glow); animation: flicker 0.15s infinite;
      box-sizing: border-box; overflow-x: hidden;
    }
    @keyframes flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }
    body::after {
      content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px),
                  radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.4) 100%);
      z-index: 999; pointer-events: none;
    }
    .screen-frame {
      border: 2px double var(--fg); background: var(--bg);
      display: flex; flex-direction: column; padding: 5px; 
      max-width: 1200px; margin: 0 auto; min-height: 92vh;
    }
    .dos-header {
      background: var(--fg); color: var(--bg); padding: 5px; 
      font-weight: bold; text-align: center; margin-bottom: 10px;
      text-transform: uppercase; font-size: 14px; text-shadow: none; 
    }
    .cmd-line { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 5px; }
    input {
      background: var(--bg); border: none; border-bottom: 2px solid var(--fg); 
      color: var(--hi); font-family: 'VT323', monospace; font-size: 18px;
      flex-grow: 1; outline: none; text-transform: uppercase;
    }
    button { background: var(--bg); color: var(--fg); border: none; font-family: 'VT323', monospace; font-size: 18px; cursor: pointer; }
    button::before { content: "[ "; } button::after { content: " ]"; }
    .viewport { flex-grow: 1; border: 1px solid var(--amber-dim); overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th { text-align: right; color: var(--hi); padding: 8px 5px; border-bottom: 2px dashed var(--fg); }
    th:first-child { text-align: left; }
    td { padding: 4px 5px; text-align: right; border-bottom: 1px solid rgba(255,140,0,0.1); }
    td:first-child { text-align: left; color: var(--hi); }
    .blink { animation: blinker 1s step-end infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
    .boot-msg { padding: 5px 10px; color: var(--amber-dim); }
  </style>
</head>
<body>

<div class="screen-frame">
  <div class="dos-header">SYSTEM TERMINAL // COOPER FLAGG METRICS V3.2</div>
  <div class="cmd-line">
    <div><span style="color:var(--fg)">SYS:\></span> <button id="btnRun">EXEC FLAGG.BIN</button></div>
    <div style="display:flex; flex-grow:1; width: 100%;">
        <span style="color:var(--fg)">FILTER:</span>
        <input type="text" id="inpCmd" placeholder="*.*" autocomplete="off">
    </div>
    <span id="sysStatus" style="color:var(--hi)">[STANDBY]</span>
  </div>
  <div class="viewport" id="consoleOutput">
    <div style="padding: 15px;">
      <div>WORKSTATION OS V3.2 (C) 1985</div>
      <br><div>MEMORY CHECK... OK</div><div>MODEM STATUS... ONLINE</div>
      <br><div>SYS:\> AWAITING COMMAND<span class="blink">_</span></div>
    </div>
  </div>
</div>

<script>
(function() {
  const URL_TARGET = "https://www.espn.com/nba/player/gamelog/_/id/5041939/cooper-flagg";
  const PROXY = "https://corsproxy.io/?url="; 

  let MEMORY = [];
  const ui = { btn: document.getElementById('btnRun'), inp: document.getElementById('inpCmd'), view: document.getElementById('consoleOutput'), stat: document.getElementById('sysStatus') };

  const clean = (v) => parseFloat(String(v).replace(/[^0-9.-]/g, '')) || 0;

  function parseStream(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    // Buscamos todas las filas que tengan celdas, sin importar la clase CSS
    const rows = Array.from(doc.querySelectorAll("tr"));
    const buffer = [];
    
    rows.forEach(tr => {
      const td = tr.querySelectorAll("td");
      // Buscamos filas que tengan al menos 10 columnas y cuya primera columna parezca una fecha
      if (td.length >= 10 && td[0].textContent.includes("/")) {
        const val = (i) => clean(td[i]?.textContent || "0");
        buffer.push({
          DATE: td[0].textContent.trim(),
          OPP: td[1].textContent.trim(),
          RES: td[2].textContent.trim(),
          MIN: val(3),
          PTS: val(td.length - 1), // En ESPN los puntos suelen ser siempre la última columna
          REB: val(10),
          AST: val(11),
          STL: val(13),
          BLK: val(12)
        });
      }
    });
    return buffer;
  }

  function render() {
    const q = ui.inp.value.toUpperCase();
    const sub = MEMORY.filter(d => d.DATE.includes(q) || d.OPP.toUpperCase().includes(q));
    if(sub.length === 0) {
      ui.view.innerHTML = '<div class="boot-msg">NO DATA FOUND IN BUFFER.</div>';
      return;
    }
    let html = `<table><thead><tr><th>DATE</th><th>OPP</th><th>RES</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr></thead><tbody>`;
    sub.forEach(r => {
      html += `<tr><td>${r.DATE}</td><td>${r.OPP}</td><td>${r.RES}</td><td>${r.MIN}</td><td>${r.PTS}</td><td>${r.REB}</td><td>${r.AST}</td><td>${r.STL}</td><td>${r.BLK}</td></tr>`;
    });
    ui.view.innerHTML = html + `</tbody></table><div class="boot-msg">EOF: ${sub.length} RECORDS.</div>`;
  }

  ui.btn.onclick = async () => {
    ui.btn.disabled = true; ui.stat.innerText = "[BUSY]";
    ui.view.innerHTML = '<div class="boot-msg">ESTABLISHING CONNECTION...</div>';
    try {
      const res = await fetch(PROXY + encodeURIComponent(URL_TARGET));
      const txt = await res.text();
      MEMORY = parseStream(txt);
      if(!MEMORY.length) throw "PARSING_ERROR";
      render();
      ui.stat.innerText = "[READY]";
    } catch(e) {
      ui.view.innerHTML = `<div class="boot-msg">SYSTEM ERROR: DATA_STREAM_FAILED</div><div class="boot-msg">ADVICE: RETRY IN 30 SECONDS</div>`;
      ui.stat.innerText = "[HALT]";
    } finally { ui.btn.disabled = false; }
  };
  ui.inp.oninput = render;
})();
</script>
</body>
</html>
